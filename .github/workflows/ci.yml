name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Syntax check
        run: |
          git ls-files '*.php' | xargs -n1 -P4 php -l > /dev/null

      - name: Install coding standards
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: WordPress coding standards and PHP compatibility
        run: vendor/bin/phpcs

  assets:
    name: JavaScript and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint:js

      - name: Build
        run: npm run build

      # The server serves assets/dist without Node, so the committed build must match the sources.
      - name: Committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- assets/dist)" ]; then
            git status --short -- assets/dist
            echo "::error::assets/dist no coincide con el código fuente. Ejecuta npm run build y haz commit de assets/dist."
            exit 1
          fi

  e2e:
    name: E2E (WordPress + WooCommerce)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Disposable WordPress with the latest WooCommerce and the frave-peru plugin (.wp-env.json).
      - name: Start WordPress
        run: npx wp-env start

      - name: Activate the theme and seed the test store
        run: |
          npx wp-env run cli wp theme activate frave
          npx wp-env run cli wp eval-file wp-content/themes/frave/tests/e2e/fixtures/seed.php
          npx wp-env run cli wp plugin list --status=active

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npx playwright test
        env:
          FRAVE_E2E_URL: http://localhost:8888

      # Fail on PHP errors, warnings or notices raised by the theme or the plugin during the run.
      - name: PHP log
        if: always()
        run: |
          npx wp-env run cli sh -c "cat wp-content/debug.log 2>/dev/null || true" > debug.log
          tail -n 40 debug.log
          if grep -E "PHP (Fatal error|Parse error|Warning|Notice|Deprecated).*(themes/frave/|frave-peru)" debug.log; then
            echo "::error::El tema o el plugin generaron errores o avisos de PHP durante las pruebas."
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
